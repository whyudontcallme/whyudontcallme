<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Muso Shokirov — system telemetry and overclock status">
  <title>System telemetry — Muso Shokirov</title>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090b"/>
      <stop offset="100%" stop-color="#0b1116"/>
    </linearGradient>
    <pattern id="tgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff66" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="tscan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff66" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tclip">
      <rect width="1000" height="330" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tclip)">
    <rect width="1000" height="330" fill="url(#tbg)"/>
    <rect width="1000" height="330" fill="url(#tgrid)"/>

    <rect x="0" y="0" width="1000" height="30" fill="url(#tscan)">
      <animate attributeName="y" values="-40;340" dur="8s" repeatCount="indefinite"/>
    </rect>

    <rect x="16" y="16" width="968" height="36" rx="8" fill="#0d1217" stroke="#00ff66" stroke-opacity="0.25"/>
    <circle cx="36" cy="34" r="5" fill="#ff5f56"/>
    <circle cx="54" cy="34" r="5" fill="#ffbd2e"/>
    <circle cx="72" cy="34" r="5" fill="#27c93f"/>
    <text x="92" y="39" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#8fa395">whyudontcallme@fsociety:~/telemetry — sys-stats --deep-scan</text>
    <rect x="860" y="28" width="8" height="12" fill="#00ff66">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="876" y="39" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12" fill="#00ff66" letter-spacing="1">LIVE</text>

    <line x1="690" y1="66" x2="690" y2="312" stroke="#00ff66" stroke-opacity="0.18"/>

    <g font-family="Consolas, Menlo, 'Courier New', monospace">
      <text x="36" y="92" font-size="11" fill="#5f7a6b" letter-spacing="1.5">DEVELOPER</text>
      <text x="196" y="92" font-size="14" fill="#e6f7ec">Muso Shokirov <tspan fill="#00e5ff">·</tspan> 17 y.o. <tspan fill="#00e5ff">·</tspan> St. Petersburg</text>

      <text x="36" y="124" font-size="11" fill="#5f7a6b" letter-spacing="1.5">RANKING</text>
      <text x="196" y="124" font-size="14" fill="#00ff66" filter="url(#tglow)">S+ TOP TIER SPECIALIST</text>

      <text x="36" y="156" font-size="11" fill="#5f7a6b" letter-spacing="1.5">AGILITY</text>
      <text x="196" y="156" font-size="14" fill="#e6f7ec">99.4% <tspan fill="#5f7a6b">—</tspan> MVP → production in &lt; 8 hours</text>

      <text x="36" y="188" font-size="11" fill="#5f7a6b" letter-spacing="1.5">CODE ACCURACY</text>
      <text x="196" y="188" font-size="14" fill="#e6f7ec">99.8% <tspan fill="#5f7a6b">—</tspan> zero-leak async architecture</text>

      <text x="36" y="220" font-size="11" fill="#5f7a6b" letter-spacing="1.5">AI SYNERGY</text>
      <text x="196" y="220" font-size="14" fill="#00ff66">MAXIMUM <tspan fill="#5f7a6b">—</tspan> neural decomposition &amp; stress-tests</text>

      <text x="36" y="252" font-size="11" fill="#5f7a6b" letter-spacing="1.5">STACK</text>
      <text x="196" y="252" font-size="14" fill="#e6f7ec">JS/TS · Python · TG Business API · WebGL 3D</text>

      <text x="36" y="284" font-size="11" fill="#5f7a6b" letter-spacing="1.5">ACCESS</text>
      <text x="196" y="284" font-size="14" fill="#ff0055" filter="url(#tglow)">ROOT / ETHICAL OVERDRIVE ENABLED</text>
    </g>

    <text x="840" y="92" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="11" fill="#5f7a6b" letter-spacing="2" text-anchor="middle">OVERCLOCK STATUS</text>

    <polygon points="902,157 871,211 809,211 778,157 809,103 871,103" fill="none" stroke="url(#tbar)" stroke-width="2.5" filter="url(#tglow)"/>
    <polygon points="893,157 866,202 814,202 787,157 814,112 866,112" fill="#00ff66" fill-opacity="0.06" stroke="#00ff66" stroke-opacity="0.22"/>
    <text x="840" y="176" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="46" font-weight="bold" fill="url(#tbar)" text-anchor="middle" filter="url(#tglow)">S+</text>

    <text x="840" y="242" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12" fill="#8fa395" text-anchor="middle">FORCE MULTIPLIER</text>
    <text x="840" y="276" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="26" font-weight="bold" fill="#00ff66" text-anchor="middle" filter="url(#tglow)">×10</text>
    <text x="840" y="300" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="10" fill="#5f7a6b" text-anchor="middle" letter-spacing="1">AI-AUGMENTED ENGINEERING</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="329" rx="14" fill="none" stroke="#00ff66" stroke-opacity="0.45"/>
</svg>
